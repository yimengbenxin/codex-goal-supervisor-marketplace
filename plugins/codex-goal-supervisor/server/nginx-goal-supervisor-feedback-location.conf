location = /v1/events {
    auth_basic off;
    limit_except POST { deny all; }
    limit_req zone=goal_feedback_per_ip burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:23100/v1/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_buffering off;
}

# Automatic device registration only. This endpoint accepts one tiny JSON
# contract; it is not a file, form, multipart, or browser upload surface.
location = /v1/devices/register {
    auth_basic off;
    limit_except POST { deny all; }
    limit_req zone=goal_feedback_registration_per_ip burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;

    proxy_pass http://127.0.0.1:23100/v1/devices/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_buffering off;
}
