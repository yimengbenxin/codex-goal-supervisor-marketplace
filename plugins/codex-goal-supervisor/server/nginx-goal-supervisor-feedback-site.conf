server {
    listen 80;
    listen [::]:80;
    server_name feedback.xn--15tf697cgrb.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feedback.xn--15tf697cgrb.xyz;

    ssl_certificate /etc/letsencrypt/live/feedback.xn--15tf697cgrb.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.xn--15tf697cgrb.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GoalFeedbackTLS:2m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    access_log /var/log/nginx/goal-supervisor-feedback-access.log;
    error_log /var/log/nginx/goal-supervisor-feedback-error.log;

    include /etc/nginx/snippets/goal-supervisor-feedback-location.conf;
    include /etc/nginx/snippets/goal-supervisor-marketplace-location.conf;

    location / {
        return 404;
    }
}
