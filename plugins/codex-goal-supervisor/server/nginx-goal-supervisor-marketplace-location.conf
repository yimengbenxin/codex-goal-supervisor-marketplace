location = /goal-supervisor-marketplace.git/git-receive-pack {
    return 403;
}

location = /goal-supervisor-marketplace.git/info/refs {
    limit_except GET HEAD { deny all; }

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
    fastcgi_param GIT_PROJECT_ROOT /var/www/goal-supervisor-marketplace;
    fastcgi_param GIT_HTTP_EXPORT_ALL 1;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param HTTP_GIT_PROTOCOL $http_git_protocol;
    fastcgi_pass unix:/run/fcgiwrap.socket;
    fastcgi_read_timeout 30s;
    fastcgi_buffering off;
}

location = /goal-supervisor-marketplace.git/git-upload-pack {
    limit_except POST { deny all; }

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
    fastcgi_param GIT_PROJECT_ROOT /var/www/goal-supervisor-marketplace;
    fastcgi_param GIT_HTTP_EXPORT_ALL 1;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param HTTP_GIT_PROTOCOL $http_git_protocol;
    fastcgi_pass unix:/run/fcgiwrap.socket;
    fastcgi_read_timeout 30s;
    fastcgi_buffering off;
}

location ^~ /goal-supervisor-marketplace.git/ {
    root /var/www/goal-supervisor-marketplace;
    default_type application/octet-stream;
    autoindex off;
    limit_except GET HEAD { deny all; }
    try_files $uri =404;
}

# Optional expert assets are downloaded only after an explicit role-library
# command. The route is read-only and serves ZIP files from one isolated root.
location ~ ^/goal-supervisor-assets/(?<asset>[A-Za-z0-9._-]+\.zip)$ {
    alias /var/www/goal-supervisor-assets/$asset;
    default_type application/zip;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /goal-supervisor-assets/ {
    return 404;
}
